# Wurzel-Manifest: die Sets, die dieses Repository anbietet.
#
# alc-books sammelt Lernsets ZU BUECHERN. Ein Buch = ein Set = ein
# Verzeichnis sets/<Quellsprache>/<Set-Id>/ mit eigenem manifest.yaml und
# lessons/NN-slug.json. Weitere Buch-Sets kommen als Geschwister daneben;
# hier wird je Set genau ein Eintrag ergaenzt und `lesson_count` ehrlich
# gehalten (es muss zu den ausgelieferten Lektionen passen).
#
# Pruefen mit:  make lint  (Engine-Gate) und  make validate
schema_version: '1.5'
name: Adaptive Learner - Buch-Lernsets
description: >-
  Lernsets zu Buechern: je Buch ein Set, dessen Lektionen der Gliederung
  des Buches folgen.
sets:
  - id: das-lebende-stimmrecht
    title: Das lebende Stimmrecht
    title_native: Das lebende Stimmrecht
    target_language: de
    source_language: de
    domain: knowledge
    level: fortgeschritten
    path: sets/de/das-lebende-stimmrecht
    version: '1.0.0'
    lesson_count: 15
    review_status: generated
    tags:
      - buch
      - demokratie
      - mitbestimmung
      - politik
  - id: biologische-souveranitat
    title: Biologische Souveränität
    title_native: Biologische Souveränität
    target_language: de
    source_language: de
    domain: knowledge
    level: grundlagen
    path: sets/de/biologische-souveranitat
    version: '1.0.0'
    lesson_count: 23
    # Aus einem Buch erzeugt und noch nicht fachlich geprueft: review_status
    # richtet sich nach der HERKUNFT, nicht nach der Qualitaet.
    review_status: generated
    tags:
      - buch
      - bioethik
      - crispr
      - genetik
  - id: example-set
    title: Spanish A1 (example)
    title_native: Español A1 (ejemplo)
    target_language: es
    source_language: en
    domain: language
    level: A1
    path: sets/en/es-a1
    version: '1.0.0'
    lesson_count: 1
    # Aus der Vorlage geerbtes Beispiel-Set, kein Lerner-Inhalt. `hidden`
    # haelt es aus dem Entdecken-Bereich der App heraus; es bleibt als
    # Referenz fuer Format und Tooling (Doku und Tests verweisen darauf).
    visibility: hidden
    tags:
      - example
      - spanish
      - a1
